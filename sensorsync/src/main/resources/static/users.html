<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SensorSync - Usuários</title>
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link href="scripts/imports/bootstrap.min.css" rel="stylesheet">
    <script src="scripts/dark_mode.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="index.html">
            <img src='./img/if_logo.png' alt='Logo' width='60' height='60' class='d-inline-block align-text-mid'>
            Usuários
        </a>
        <div class="navbar-nav me-auto"><a class="nav-link" href="index.html">Voltar</a></div>
        <div class="navbar-nav" id="userMenu"></div>
    </div>
</nav>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Contas da plataforma</h1>
        <button class="btn btn-primary" onclick="openUserModal()">Novo usuário</button>
    </div>
    <p class="small text-body-secondary">Usuários comuns veem e gerenciam apenas os próprios projetos.
        Administradores veem todos os projetos e gerenciam contas.</p>
    <div id="usersList"></div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="userModalTitle">Usuário</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="uId">
                <div class="mb-2"><label class="form-label" for="uLogin">Login</label>
                    <input class="form-control" id="uLogin" autocomplete="off"></div>
                <div class="row g-2 mb-2">
                    <div class="col"><label class="form-label" for="uFirst">Nome</label><input class="form-control" id="uFirst"></div>
                    <div class="col"><label class="form-label" for="uLast">Sobrenome</label><input class="form-control" id="uLast"></div>
                </div>
                <div class="mb-2"><label class="form-label" for="uEmail">E-mail</label><input type="email" class="form-control" id="uEmail"></div>
                <div class="mb-2"><label class="form-label" for="uPassword" id="uPasswordLabel">Senha (mínimo 8 caracteres)</label>
                    <input type="password" class="form-control" id="uPassword" autocomplete="new-password"></div>
                <div class="row g-2 mb-2">
                    <div class="col"><label class="form-label" for="uRole">Papel</label>
                        <select class="form-select" id="uRole"><option value="USER">Usuário</option><option value="ADMIN">Administrador</option></select></div>
                    <div class="col d-flex align-items-end"><div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="uEnabled" checked>
                        <label class="form-check-label" for="uEnabled">Conta ativa</label></div></div>
                </div>
                <div id="uMsg" class="text-danger small"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="saveUser()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script src="scripts/imports/bootstrap.bundle.min.js"></script>
<script src="scripts/app.js"></script>
<script src="scripts/users.js"></script>
</body>
</html>
