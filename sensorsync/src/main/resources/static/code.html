<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SensorSync - Código embarcado</title>
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link href="scripts/imports/bootstrap.min.css" rel="stylesheet">
    <script src="scripts/dark_mode.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="index.html">
            <img src='./img/if_logo.png' alt='Logo' width='60' height='60' class='d-inline-block align-text-mid'>
            <span id="codeTitle">Código do sistema embarcado</span>
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" id="dashboardLink" href="#">Abrir dashboard</a>
        </div>
        <div class="navbar-nav" id="userMenu"></div>
    </div>
</nav>

<div class="container my-4">
    <div id="tokensBox"></div>

    <div class="row g-3 align-items-end mb-3">
        <div class="col-md-4">
            <label class="form-label" for="board">Placa</label>
            <select class="form-select" id="board">
                <option value="ESP8266">ESP8266</option>
                <option value="ESP32">ESP32</option>
                <option value="ARDUINO_ESP8266">Arduino + ESP8266</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="protocol">Protocolo</label>
            <select class="form-select" id="protocol">
                <option value="HTTP">HTTP</option>
                <option value="MQTT">MQTT</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="device">Dispositivo</label>
            <select class="form-select" id="device"></select>
        </div>
    </div>

    <div class="alert alert-info small">
        Instale a biblioteca <strong>SensorSync</strong> pela IDE Arduino (<em>Ferramentas &gt; Gerenciar Bibliotecas</em>,
        busque por "SensorSync"); a dependência PubSubClient é instalada junto. Depois preencha o nome e a senha da rede Wi-Fi no código.
    </div>

    <div id="codeGenerated"></div>
</div>

<script src="scripts/imports/bootstrap.bundle.min.js"></script>
<script src="scripts/app.js"></script>
<script src="scripts/code.js"></script>
</body>
</html>
