<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SensorSync - Projetos</title>
    <link rel="icon" type="image/png" href="img/if_logo.png">
    <link href="scripts/imports/bootstrap.min.css" rel="stylesheet">
    <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <link href="styles/app.css" rel="stylesheet">
    <script src="scripts/dark_mode.js"></script>
</head>
<body>
<nav id="appNav"></nav>

<main class="container-xl">
    <div class="ss-page-header d-flex flex-wrap align-items-end justify-content-between gap-3">
        <div>
            <p class="ss-muted mb-1" id="greeting">&nbsp;</p>
            <h1>Seus projetos</h1>
        </div>
        <div class="d-flex gap-2">
            <div class="input-group" style="max-width: 260px;">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" class="form-control" id="search" name="ss-filtro-projetos" placeholder="Buscar projeto"
                       aria-label="Buscar projeto" autocomplete="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-form-type="other"
                       readonly onfocus="this.removeAttribute('readonly')">
            </div>
            <a href="generator.html" class="btn btn-primary text-nowrap"><i class="bi bi-plus-lg me-1"></i>Novo projeto</a>
        </div>
    </div>

    <div class="row g-3 mb-4" id="stats"></div>

    <div class="row g-3" id="projects"></div>
</main>

<footer id="appFooter"></footer>

<!-- Transferir dono do projeto (admin) -->
<div class="modal fade" id="transferModal" tabindex="-1" aria-labelledby="transferTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="transferTitle"><i class="bi bi-person-gear me-2"></i>Transferir projeto</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <p class="small ss-muted">O novo dono passa a ver e gerenciar <strong id="transferName"></strong>.
                    Os dispositivos e tokens continuam os mesmos.</p>
                <label class="form-label" for="transferUser">Novo dono</label>
                <select class="form-select" id="transferUser"></select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="confirmTransfer()">Transferir</button>
            </div>
        </div>
    </div>
</div>

<script src="scripts/imports/bootstrap.bundle.min.js"></script>
<script src="scripts/app.js"></script>
<script src="scripts/index.js"></script>
</body>
</html>
