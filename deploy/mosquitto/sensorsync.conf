# /etc/mosquitto/conf.d/sensorsync.conf
# Broker do SensorSync: placas conectam com TLS na 8883; a API usa a 1883 so dentro da maquina.
# Os certificados sao gerados por sensorsync-tls.service (pasta /etc/sensorsync/tls).

per_listener_settings false
# A autenticacao das placas e feita pela API (token no payload); ver README, secao TLS.
allow_anonymous true

# Somente local (API). Para os experimentos sem TLS a partir de outra maquina, troque
# 127.0.0.1 por 0.0.0.0 temporariamente.
listener 1883 127.0.0.1

listener 8883
cafile /etc/sensorsync/tls/ca.crt
certfile /etc/sensorsync/tls/server.crt
keyfile /etc/sensorsync/tls/server.key
